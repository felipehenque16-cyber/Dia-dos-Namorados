<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>T & F | Nossa História de Amor</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* CSS COMPLETO E OTIMIZADO */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-user-drag: none; }
    body { background-color: #fffaf8; font-family: 'Plus Jakarta Sans', sans-serif; color: #2c2c2c; scroll-behavior: smooth; overflow-x: hidden; position: relative; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #fffaf8; } ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%); border-radius: 10px; }
    
    /* BLOQUEIO SENHA */
    .lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), url('https://i.ibb.co/TBXs3VBz/IMG-20250112-WA0003.jpg'); background-size: cover; background-position: center; z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 1.5rem; transition: all 0.8s; }
    .lock-screen.unlocked { opacity: 0; transform: translateY(-100vh); pointer-events: none; }
    .lock-box { width: 100%; max-width: 420px; padding: 3.5rem 2rem; text-align: center; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 36px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
    .lock-input { width: 100%; padding: 16px; border-radius: 50px; border: 1.5px solid #ff9a9e; text-align: center; margin-bottom: 1rem; font-size: 1.2rem; }

    /* SEÇÕES E ELEMENTOS */
    .btn { position: relative; overflow: hidden; background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #5c3d46; border: none; padding: 15px 36px; border-radius: 50px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 25px rgba(255, 154, 158, 0.35); transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(44, 34, 30, 0.45), rgba(0, 0, 0, 0.55)), url('https://i.ibb.co/zh6KLxGT/IMG-20240111-WA0019.jpg'); background-size: cover; background-position: center; background-attachment: fixed; }
    .container { max-width: 1000px; margin: 0 auto; padding: 4rem 1.5rem; }
    .glass-card { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(16px); border-radius: 24px; padding: 3rem; margin-bottom: 3rem; }
    .reveal-on-scroll { opacity: 0; transform: translateY(30px); transition: all 0.8s; }
    .reveal-on-scroll.visible { opacity: 1; transform: translateY(0); }
    
    /* GALERIA */
    .slider-container { width: 100%; max-width: 700px; height: 500px; margin: 0 auto; overflow: hidden; border-radius: 32px; position: relative; border: 8px solid white; }
    .slider-track { display: flex; height: 100%; transition: transform 0.6s; }
    .slide-item { min-width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .slide-item::before { content: ''; position: absolute; top:0; left:0; right:0; bottom:0; background-image: var(--bg-img); background-size: cover; filter: blur(25px) brightness(0.75); z-index: 1; }
    .slide-item img { max-width: 100%; max-height: 100%; object-fit: contain; z-index: 2; }
    
    /* MÚSICA */
    #youtubePlayer { position: absolute; top: 0; left: -9999px; width: 0; height: 0; visibility: hidden; }
  </style>
</head>
<body id="topo">

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2>Baú de Memórias</h2>
    <input type="text" class="lock-input" id="lockInput" placeholder="13/01/2022" maxlength="10">
    <div id="errorMsg" style="color:red; display:none;">Data incorreta.</div>
    <button class="btn" id="btnUnlock">DESBLOQUEAR</button>
  </div>
</div>

<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-box">
    <h2>Para o meu amor...</h2>
    <button class="btn" id="btnEnterSite">ABRIR PRESENTE</button>
  </div>
</div>

<header class="header">
  <div class="nav">
    <div class="logo">T & F</div>
    <div class="nav-links">
      <a href="#historia">História</a><a href="#galeria">Galeria</a><a href="#carta">Carta</a><a href="#musica">Música</a>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Cada capítulo da minha vida<span>ficou mais bonito desde que você chegou.</span></h1>
    <a href="#historia" class="btn">NOSSA HISTÓRIA</a>
  </div>

  <div class="container">
    <section id="historia" class="reveal-on-scroll glass-card">
      <h2>Nossa história</h2>
      <p>Lembro como se fosse ontem... (seu texto)</p>
    </section>
    
    <section id="galeria" class="reveal-on-scroll">
      <div class="slider-container">
        <div class="slider-track" id="sliderTrack"></div>
      </div>
    </section>

    <section id="musica" class="reveal-on-scroll glass-card">
      <iframe id="youtubePlayer" src="https://www.youtube.com/embed/qUD2GxTeVcI" allow="autoplay"></iframe>
      <button id="playMusicBtn" class="btn">Reiniciar Música</button>
    </section>
  </div>
</main>
