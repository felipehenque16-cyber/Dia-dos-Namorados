<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>T & F | Nossa História de Amor</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* CSS COMPLETO E OTIMIZADO */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
    body { background-color: #fffaf8; font-family: 'Plus Jakarta Sans', sans-serif; color: #2c2c2c; scroll-behavior: smooth; overflow-x: hidden; position: relative; }
    
    /* BLOQUEIO POR SENHA */
    .lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), url('https://i.ibb.co/TBXs3VBz/IMG-20250112-WA0003.jpg'); background-size: cover; background-position: center; z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 1.5rem; transition: all 0.8s; }
    .lock-screen.unlocked { opacity: 0; transform: translateY(-100vh); pointer-events: none; }
    .lock-box { width: 100%; max-width: 420px; padding: 3.5rem 2rem; text-align: center; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 36px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
    .lock-input { width: 100%; padding: 16px; border-radius: 50px; border: 1.5px solid #ff9a9e; text-align: center; margin-bottom: 1rem; }
    
    /* COMPONENTES ORIGINAIS E SEÇÕES */
    .btn { background: linear-gradient(135deg, #ff9a9e, #fecfef); padding: 15px 36px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; }
    .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(44, 34, 30, 0.45), rgba(0, 0, 0, 0.55)), url('https://i.ibb.co/zh6KLxGT/IMG-20240111-WA0019.jpg'); background-size: cover; background-position: center; }
    .hero h1 { font-size: 3.5rem; color: white; font-family: 'Playfair Display', serif; }
    .container { max-width: 1000px; margin: 0 auto; padding: 4rem 1.5rem; }
    .glass-card { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(16px); border-radius: 24px; padding: 3rem; margin-bottom: 3rem; }
    
    /* GALERIA AJUSTADA */
    .slider-container { width: 100%; max-width: 700px; height: 500px; margin: 0 auto; overflow: hidden; border-radius: 32px; position: relative; }
    .slider-track { display: flex; height: 100%; transition: transform 0.6s; }
    .slide-item { min-width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
    .slide-item img { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    /* DEMAIS ESTILOS (MANTENHA OS ORIGINAIS) */
    .reveal-on-scroll { opacity: 0; transform: translateY(30px); transition: all 0.8s; }
    .reveal-on-scroll.visible { opacity: 1; transform: translateY(0); }
    #youtubePlayer { position: absolute; top: 0; left: -9999px; width: 0; height: 0; }
  </style>
</head>
<body id="topo">

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2>Baú de Memórias</h2>
    <input type="text" class="lock-input" id="lockInput" placeholder="13/01/2022" maxlength="10">
    <div id="errorMsg" style="color:red; display:none;">Data incorreta.</div>
    <button class="btn" id="btnUnlock">DESBLOQUEAR</button>
  </div>
</div>

<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-box">
    <h2>Para o meu amor...</h2>
    <button class="btn" id="btnEnterSite">ABRIR PRESENTE</button>
  </div>
</div>

<header class="header">
  <div class="nav">
    <div class="logo">T & F</div>
    <div class="nav-links">
      <a href="#historia">História</a><a href="#galeria">Galeria</a><a href="#carta">Carta</a>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Cada capítulo da minha vida<span>ficou mais bonito desde que você chegou.</span></h1>
  </div>

  <div class="container">
    <section id="historia" class="reveal-on-scroll glass-card">
      <h2>Nossa história</h2>
      <p>Lembro como se fosse ontem... (seu texto original)</p>
    </section>
    
    <section id="galeria" class="reveal-on-scroll">
      <div class="slider-container">
        <div class="slider-track" id="sliderTrack"></div>
      </div>
    </section>

    <section id="musica" class="reveal-on-scroll glass-card">
      <iframe id="youtubePlayer" src="https://www.youtube.com/embed/42QG9tIHRsQ" allow="autoplay"></iframe>
      <p>Música tocando...</p>
    </section>
  </div>
</main>

<script>
  // SENHA
  document.getElementById('btnUnlock').addEventListener('click', () => {
    if (document.getElementById('lockInput').value === "13/01/2022") {
      document.getElementById('lockScreen').classList.add('unlocked');
    } else { document.getElementById('errorMsg').style.display = 'block'; }
  });

  // ENTER SITE
  document.getElementById('btnEnterSite').addEventListener('click', () => {
    document.getElementById('welcomeOverlay').classList.add('fade-out');
    document.getElementById('youtubePlayer').src += "?autoplay=1";
  });

  // GALERIA (Fotos originais)
  const fotos = ["https://i.ibb.co/jZhRC9X7/IMG-20251120-WA0005.jpg", "https://i.ibb.co/67X49YsZ/IMG-20221125-WA0000.jpg"]; // Adicione o resto aqui
  const track = document.getElementById('sliderTrack');
  fotos.forEach(src => {
    const div = document.createElement('div');
    div.className = 'slide-item';
    div.innerHTML = `<img src="${src}">`;
    track.appendChild(div);
  });
  
  // SCROLL REVEAL
  const observer = new IntersectionObserver(e => e.forEach(i => i.isIntersecting && i.target.classList.add('visible')));
  document.querySelectorAll('.reveal-on-scroll').forEach(e => observer.observe(e));
</script>
</body>
</html>
